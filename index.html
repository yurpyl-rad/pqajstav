<script>

//function parseDate(s) {
//  const d = new Date(s); // JavaScript new Date() interprets them as MM.DD.YYYY or treats them inconsistently.
//  return isNaN(d) ? null : d;
//}
function parseDate(s) {
  if (!s) return null;

  // Detect DD.MM.YYYY or D.M.YYYY
  const parts = s.split('.');
  if (parts.length === 3) {
      const [dd, mm, yyyy] = parts.map(p => parseInt(p));
      if (!isNaN(dd) && !isNaN(mm) && !isNaN(yyyy)) {
          return new Date(yyyy, mm - 1, dd); // JS months are 0‑based
      }
  }

  // fallback for ISO / other supported formats
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function unique(arr, col) {
  return [...new Set(arr.map(row => row[col]))].filter(x => x !== undefined && x !== null && x !== "");
}

  ////////////////////

// Filter data on selection --- here
function getFiltered() {
  //let data = allData;
  //document.querySelectorAll('.filter').forEach(filt => {
  //  let val = filt.value;
  //  let col = filt.getAttribute('data-col');
  // if (val !== 'All') data = data.filter(row => String(row[col]) === val);
  //});
  //return data;
  const filters = {};
  document.querySelectorAll('.multi-select').forEach(dropdown => {
    const col = dropdown.dataset.col;
    const selected = Array.from(dropdown.querySelectorAll('input:checked')).map(cb => cb.value);
    if (selected.length > 0) {
      filters[col] = selected;
    }
  });
  
  // Filter the data
  let filteredData = allData;
  filteredData = allData.filter(row => {
    return Object.entries(filters).every(([col, selectedVals]) => {
      return selectedVals.includes(row[col]);
    });
  });
  
  // Date range filtering
  const dStart = new Date(document.getElementById("dateStart").value);
  const dEnd = new Date(document.getElementById("dateEnd").value);
  filteredData = filteredData.filter(row => {
    const d = parseDate(row["Date"]);
    if (!d) return false;

    if (document.getElementById("dateStart").value && d < dStart) return false;
    if (document.getElementById("dateEnd").value && d > dEnd) return false;

    return true;
  });
  
  // GPS slider filtering
  const gpsMin = parseFloat(document.getElementById('gpsMin').value);
  const gpsMax = parseFloat(document.getElementById('gpsMax').value);

  filteredData = filteredData.filter(row => {
    let gps = parseFloat(row["F0-GPS"]);
    return !isNaN(gps) && gps >= gpsMin && gps <= gpsMax;
  });
  
  return filteredData;
}

function updateAll() {
  filteredData = getFiltered();
  drawScatter();
  drawTimeSeries();
  drawBar();
  drawHistogram();
  drawPie();
  drawSummary();
}

// Scatter plot
function drawScatter() {
  let xCol = document.getElementById('scatterX').value;
  let yCol = document.getElementById('scatterY').value;
  let x = [], y = [];
  filteredData.forEach(row => {
    let xv = parseFloat(row[xCol]);
    let yv = parseFloat(row[yCol]);
    if (!isNaN(xv) && !isNaN(yv)) { x.push(xv); y.push(yv);}
  });
  Plotly.newPlot('scatter', [{
    x, y, mode: 'markers', type:'scatter', marker:{color:'royalblue'}
  }], {margin:{t:20, b:40, l:50, r:20}, xaxis:{title:{text: xCol}}, yaxis:{title:{text: yCol}}});
}

// Time series plot with aggregation and trend
function drawTimeSeries() {
  let dateCol = document.getElementById('dateCol').value;
  let yCol = document.getElementById('timeSeriesY').value;
  let agg = document.getElementById('agg').value;

  let points = [];
  filteredData.forEach(row => {
    let d = parseDate(row[dateCol]);
    let v = parseFloat(row[yCol]);
    if (d && !isNaN(v)) points.push({date: d, value: v});
  });

  // Group by requested period
  let groupFmt;
  if (agg === 'raw') groupFmt = d=>d.toISOString()
  if (agg === 'day') groupFmt = d=>d.toISOString().slice(0,10);
  if (agg === 'week') groupFmt = d=>{
    let y = d.getFullYear(); let w = Math.ceil((d - new Date(y,0,1)) / 604800000);
    return y + "-W" + w;
  };
  if (agg === 'month') groupFmt = d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

  const groups = {};
  points.forEach(({date, value}) => {
    let g = groupFmt(date);
    if (!groups[g]) groups[g] = [];
    groups[g].push(value);
  });

  let x = Object.keys(groups).sort();
  let y = x.map(g => {
    let vals = groups[g];
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  });

  // Linear trendline
  let xi = x.map((_,i)=>i), n=x.length;
  let xbar = (n && xi.reduce((a,b)=>a+b,0)/n) || 0;
  let ybar = (n && y.reduce((a,b)=>a+b,0)/n) || 0;
  let slope = (n && xi.reduce((s,i)=>s+(i-xbar)*(y[i]-ybar),0) / xi.reduce((s,i)=>s+(i-xbar)**2,0)) || 0;
  let intercept = ybar - slope*xbar;
  let yfit = xi.map(i => slope*i + intercept);

  Plotly.newPlot('timeseries', [
    {x, y, name:'Avg', mode:'lines+markers', marker:{color:'seagreen'}},
    {x, y: yfit, name:'Trend', mode:'lines', line:{dash:'dot', color:'red'}}
  ], {margin:{t:20}, xaxis:{title:{text: agg}}, yaxis:{title:{text: yCol}}});
}

// Bar plot for chosen column
function drawBar() {
  let col = document.getElementById('barCol').value;
  let groups = {};
  filteredData.forEach(row => {
    let v = row[col];
    if (v !== undefined && v !== null && v !== '') {
      groups[v] = (groups[v] || 0) + 1;
    }
  });
  let x = Object.keys(groups);
  let y = x.map(k => groups[k]);
  Plotly.newPlot('bar', [{
    x, y, type:'bar', marker:{color:'orange'}
  }], {margin:{t:20}, title: {text: `Barplot of ${col}`, font: {family: 'Arial', size: 14, color: '#333'}}, yaxis:{title:{text: 'Count'}}});
}
// Histogram plot
function drawHistogram() {
  const col = document.getElementById('histogramCol').value;
  //const monthIndex = parseInt(document.getElementById('monthSlider').value);
  //const monthFiltered = filteredData.filter(row => {
  //  const date = new Date(row['PlanDate']);
  //  return date.getMonth() === monthIndex;
  //});
  //const values = monthFiltered.map(row => parseFloat(row[col])).filter(v => !isNaN(v));
  const values = filteredData.map(row => parseFloat(row[col])).filter(v => !isNaN(v));
  const averaging = document.getElementById('histogramAveraging').value;
  let averagedData = [];

  if (averaging === 'raw') {
    averagedData = values;
  } else {
    const grouped = {};
    filteredData.forEach(row => {
      const date = new Date(parseDate(row['Date']));
      console.log("row date is ", row['Date'])
      console.log("date is ", date)
      let key;
      if (averaging === 'daily') key = date.toISOString().split(' ')[0];
      function getISOWeek(date) {
        const tempDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = tempDate.getUTCDay() || 7;
        tempDate.setUTCDate(tempDate.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(), 0, 1));
        const weekNum = Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);
        return `${tempDate.getUTCFullYear()}-W${weekNum.toString().padStart(2, '0')}`;
      }
      if (averaging === 'weekly') key = getISOWeek(date) //`${date.getFullYear()}-W${Math.ceil(date.getDate() / 7)}`;
      if (averaging === 'monthly') key = `${date.getFullYear()}-${date.getMonth() + 1}`;

      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(parseFloat(row[col]));
    });
    
    averagedData = Object.values(grouped).map(arr => {
      const valid = arr.filter(v => !isNaN(v));
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    });
  }

  const values1 = averagedData
  console.log("the suggested mean calc values1: ", values1)
  console.log("the suggested mean calc values1.reduce((a, b) => a + b, 0): ", values1.reduce((a, b) => a + b, 0))
  console.log("the suggested mean calc values1.length: ", values1.length)
  const mean = values1.reduce((a, b) => a + b, 0) / values1.length;
  const std = Math.sqrt(values1.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / values1.length);
  const ci95 = mean - (1.96 * std) // / Math.sqrt(values1.length); // 95% confidence interval
  const N = values1.length;
  const stdErr = std / Math.sqrt(N);
  const ci95_low  = mean - 1.96 * stdErr;
  //const ci95_high = mean + 1.96 * stdErr;


  const statsText = `Mean: ${mean.toFixed(2)}<br>Std Dev: ${std.toFixed(2)}<br><span style="background-color: yellow;">95% CI: &gt;${ci95_low.toFixed(2)}</span><br><span style="background-color: yellow;">Ctrl.Lim: &gt;${ci95.toFixed(2)}</span>` //95% CI: >${ci95.toFixed(2)}`;


  const trace = {
    x: values1,
    type: 'histogram',
    marker: { color: '#3399ff' }
  };

  // Compute histogram bins using Plotly's internal binning helper





  Plotly.newPlot('histogram', [trace], {
    title: {text: `Histogram of ${col}`, font: {family: 'Arial', size: 14, color: '#333'} },
    xaxis: { title: {text: col } },
    yaxis: { title: {text: 'Count' } },
	//shapes: shapes,
	annotations: [{
		text: statsText,
		xref: 'paper',
		yref: 'paper',
		x: 1.05, //ner left edge //x: 1.05, // slightly beyond right edge
		y: 1.25, // slightly above top edge
		showarrow: false,		
        //xanchor: 'left',
        //yanchor: 'top',
		align: 'auto',
		bgcolor: '#f0f0f0',
		bordercolor: '#ccc',
		borderwidth: 1,
		font: { size: 12 }
    }]
  }).then(gd => {

    // Get the computed histogram bins & counts
    const hist = gd.calcdata[0];          // Plotly’s internal histogram data
    const counts = hist.map(bin => bin.y);
    const maxY = Math.max(...counts);

    // Build vertical shapes using maxY
    const shapes = [
	  {
		type: 'line',
		x0: ci95_low,
		x1: ci95_low,

// Reusable ISO week key (YYYY-Www)
function getISOWeekKey(dateObj) {
  if (!dateObj) return null;
  const tmp = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
  const dayNum = tmp.getUTCDay() || 7;
  tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  const weekNum = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
  return `${tmp.getUTCFullYear()}-W${String(weekNum).padStart(2,'0')}`;
}

function drawSummary() {
  const el = document.getElementById('summary');
  if (!filteredData || !filteredData.length) { el.innerHTML = "No data"; return; }

  // ---- Utilities on filtered data ----
  const toNum = v => {
    const x = parseFloat(String(v).replace(',', '.')); // guard comma decimals
    return Number.isFinite(x) ? x : NaN;
  };

  // Dates
  const dates = filteredData
    .map(r => parseDate(r['Date']))
    .filter(d => d instanceof Date && !isNaN(d));
  const oldest = dates.length ? new Date(Math.min(...dates)) : null;
  const newest = dates.length ? new Date(Math.max(...dates)) : null;

  // Unique plan count (requires plan_global_index)
  const planIds = new Set(
    filteredData.map(r => r['plan_global_index']).filter(v => v !== undefined && v !== null && String(v) !== '')
  );
  const totalPlans = planIds.size;

  // Group-by helpers for daily / weekly / monthly plan counts
  function groupCountsBy(keyFn) {
    const m = new Map(); // key -> Set(plan_global_index)
    for (const r of filteredData) {
      const d = parseDate(r['Date']); if (!d) continue;
      const pid = r['plan_global_index']; if (pid === undefined || pid === null || String(pid)==='') continue;
      const k = keyFn(d);
      if (!m.has(k)) m.set(k, new Set());
      m.get(k).add(pid);
    }
    // return array of counts per period
    return Array.from(m.values()).map(set => set.size);
  }
  const dailyCounts   = groupCountsBy(d => d.toISOString().slice(0,10)); // YYYY-MM-DD
  const weeklyCounts  = groupCountsBy(getISOWeekKey);
  const monthlyCounts = groupCountsBy(d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);

  const avg = arr => (arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length) : 0);

  // ---- Requested numeric columns: mean/min/max ----
  // Names taken from your CSV header exactly.  (If one is missing in a given file it will be skipped.)
  const metricCols = [
    // Criterion & Result DD
    {label: 'Criterion DD (%)',          col: 'Criterion DD (%)'},
    {label: 'Criterion DD (cGy)',        col: 'Criterion DD(cGy)'},
    {label: 'Result DD abs: cGy',        col: 'Result DD abs: cGy'},
    {label: 'Result DD rel: %',          col: 'Result DD rel: %'},
    // F0 block
    {label: 'F0-Toleranse',              col: 'F0-Toleranse'},
    {label: 'F0-GPS',                    col: 'F0-GPS'},
    {label: 'F0-failHigh',               col: 'F0-failHigh'},
    {label: 'F0-failLow',                col: 'F0-failLow'},
    {label: 'F0-total',                  col: 'F0-total'},
    {label: 'F0-pointsAverage',          col: 'F0-pointsAverage'},
    {label: 'F0-pointsSTDEV',            col: 'F0-pointsSTDEV'},
    {label: 'F0-EVENT-COUNT',            col: 'F0-EVENT-COUNT'},
    // geometry / field
    {label: 'field size (cm2)',          col: 'field size (cm2)'},
    {label: 'FCO_2D (cm)',               col: 'FCO_2D (cm)'},
    {label: 'FCO_X (cm)',                col: 'FCO_X (cm)'},
    {label: 'FCO_Y (cm)',                col: 'FCO_Y (cm)'},
    {label: 'MU:(130*Dfr)',              col: 'MU:(130*Dfr)'},
  ];

  function statsFor(col) {
    if (!filteredData[0].hasOwnProperty(col)) return null;
    const vals = filteredData.map(r => toNum(r[col])).filter(v => Number.isFinite(v));
    if (!vals.length) return {mean: NaN, min: NaN, max: NaN};
    const s = vals.reduce((a,b)=>a+b,0)/vals.length;
    return {mean: s, min: Math.min(...vals), max: Math.max(...vals)};
  }

  // List of all beam energies from both columns (if present)
  function listBeamEnergies() {
    const cols = ['Energy','F0BeamEnergy']; // seen in sample CSV
    const set = new Set();
    for (const r of filteredData) {
      for (const c of cols) if (r.hasOwnProperty(c)) {
        const v = String(r[c]).trim();
        if (v !== '' && v.toLowerCase() !== 'na' && v !== 'undefined') set.add(v);
      }
    }
    // normalize numeric-like values to a sorted list
    const nums = [], texts = [];
    for (const v of set) {
      const f = toNum(v);
      if (Number.isFinite(f)) nums.push(f); else texts.push(v);
    }
    nums.sort((a,b)=>a-b);
    texts.sort((a,b)=>a.localeCompare(b));
    return [...nums.map(x=>String(x)), ...texts];
  }

  // ---- Render HTML ----
  let html = '';

  // KPI header table
  html += '<table><tr><th colspan="2">Plan KPIs (filtered)</th></tr>';
  html += `<tr><td>Total plans (unique plan_global_index)</td><td><b>${totalPlans}</b></td></tr>`;
  html += `<tr><td>Avg plans / day</td><td>${avg(dailyCounts).toFixed(2)}</td></tr>`;
  html += `<tr><td>Avg plans / week</td><td>${avg(weeklyCounts).toFixed(2)}</td></tr>`;
  html += `<tr><td>Avg plans / month</td><td>${avg(monthlyCounts).toFixed(2)}</td></tr>`;
  html += `<tr><td>Oldest plan date</td><td>${oldest ? oldest.toISOString().slice(0,10) : '—'}</td></tr>`;
  html += `<tr><td>Newest plan date</td><td>${newest ? newest.toISOString().slice(0,10) : '—'}</td></tr>`;
  html += '</table><br/>';

  // Numeric metrics (mean/min/max) — only for the requested columns
  html += '<table><tr><th>Metric</th><th>Mean</th><th>Min</th><th>Max</th></tr>';
  for (const m of metricCols) {
    const s = statsFor(m.col);
    if (!s) continue; // column not present
    const fmt = (x) => Number.isFinite(x) ? x.toFixed(3) : '—';
    html += `<tr><td>${m.label}</td><td>${fmt(s.mean)}</td><td>${fmt(s.min)}</td><td>${fmt(s.max)}</td></tr>`;
  }
  html += '</table><br/>';

  // Beam energies list
  const energies = listBeamEnergies();
  html += '<table><tr><th>Beam energies (unique)</th></tr>';
  html += `<tr><td>${energies.join(', ') || '—'}</td></tr>`;
  html += '</table>';

  el.innerHTML = html;
}
